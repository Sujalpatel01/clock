<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jyotirlinga Clock - Sacred Time</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/Om_symbol.svg/1200px-Om_symbol.svg.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="month-display"></div>
        <button id="languageToggle">ગુજરાતી મોડ</button>
        <div id="theme-switcher">
            <button id="default-theme" class="active" data-theme="default" title="Default Theme"></button>
            <button id="gold-theme" data-theme="gold" title="Gold Theme"></button>
            <button id="green-theme" data-theme="green" title="Green Theme"></button>
        </div>
        <div class="clock-container">
            <div class="clock-face-elements"></div>
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <div class="center-god">
                <img src="https://imgs.search.brave.com/H4ExS9SgbjFr4TJLLmAGnyKdI_OFyQAhNIzBxwPCg6Y/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWFn/ZXMucGV4ZWxzLmNv/bS9waG90b3MvMTg4/NDkyMDMvcGV4ZWxz/LXBob3RvLTE4ODQ5/MjAzL2ZyZWUtcGhv/dG8tb2YtY2xvc2Ut/dXAtb2Ytc2hpdmEt/c3RhdHVlLmpwZWc_/YXV0bz1jb21wcmVz/cyZjcz10aW55c3Jn/YiZkcHI9MSZ3PTUw/MA" alt="God Hivaji">
            </div>
        </div>
        <div class="digital-time-display"></div>
        <div class="digital-date-display"></div>
    </div>

    <div class="jyotirlinga-info-modal" id="jyotirlingaInfoModal">
        <div class="modal-content">
            <img id="modalImage" src="" alt="Jyotirlinga Image" onerror="this.style.display='none'">
            <h3 id="modalTitle"></h3>
            <p class="location" id="modalLocation"></p>
            <audio id="audioPlayer" controls style="display: none;"></audio>
            <div class="video-player" id="videoPlayer" style="display: none;"></div>
            <p class="shloka-text" id="shlokaText"></p>
            <button class="close-modal">Close</button>
        </div>
    </div>

    <audio id="backgroundMusic" loop autoplay>
        <source src="https://koshalworld.com/files/download/id/19944" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <script src="script.js"></script>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VNH9JD5ZWM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-VNH9JD5ZWM');
</script>
</body>
</html>
